name: Omega Formal Gates

on:
  pull_request:
    paths:
      - "research/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "docs/OMEGA_*"
      - ".github/workflows/omega-formal-gates.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/omega-formal-gates.yml"

permissions:
  contents: read

jobs:
  formal-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/omega_theory_r1.schema.json >/dev/null
          python -m json.tool research/omega_toy_model_r1.json >/dev/null
          python -m json.tool research/omega_toy_model_r2.json >/dev/null
          python -m json.tool research/omega_constraint_model_r1.json >/dev/null
          python -m json.tool research/omega_history_model_r1.json >/dev/null
          python -m json.tool research/omega_composition_model_r1.json >/dev/null
          python -m json.tool research/omega_free_path_model_r1.json >/dev/null
          python -m json.tool research/omega_quotient_model_r1.json >/dev/null
          python -m json.tool research/omega_multioperation_model_r1.json >/dev/null
          python -m json.tool research/omega_r9_pc_evidence.json >/dev/null
          python -m json.tool research/omega_observable_model_r1.json >/dev/null
          python -m json.tool research/omega_r10_pc_evidence.json >/dev/null
          python -m json.tool research/omega_effective_error_model_r1.json >/dev/null
          python -m json.tool research/omega_r11_pc_evidence.json >/dev/null

      - name: Dependency DAG and anti-circularity gate
        run: |
          python tools/verify_dependency_dag.py             research/omega_toy_model_r1.json             research/omega_toy_model_r2.json             research/omega_constraint_model_r1.json             research/omega_history_model_r1.json             research/omega_composition_model_r1.json             research/omega_free_path_model_r1.json \
            research/omega_quotient_model_r1.json \
            research/omega_multioperation_model_r1.json \
            research/omega_observable_model_r1.json \
            research/omega_effective_error_model_r1.json

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Exhaustive reachability verifier
        run: python tools/verify_reachability_order.py --max-n 4

      - name: Exhaustive history-relation equivalence verifier
        run: python tools/verify_history_relation_equivalence.py --max-n 3

      - name: Composition information-loss witness
        run: python tools/verify_composition_information.py

      - name: Free-path category verifier
        run: python tools/verify_free_path_category.py --max-len 4

      - name: Quotient congruence verifier
        run: python tools/verify_quotient_congruence.py

      - name: Multi-operation congruence verifier
        run: python tools/verify_multioperation_congruence.py

      - name: Observable preservation verifier
        run: python tools/verify_observable_preservation.py

      - name: Effective error-budget verifier
        run: python tools/verify_effective_error_budget.py
